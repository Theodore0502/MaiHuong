<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mai Hương · 2.5D Parallax Showcase</title>
  <meta name="description" content="Tác phẩm Mai Hương - Trình diễn minh họa nhân vật 2.5D Parallax đa tầng tương tác." />

  <!-- Google Fonts: Classical Serif & Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Preload core assets for instant rendering -->
  <link rel="preload" as="image" href="assets/b1.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/c1.webp" type="image/webp" fetchpriority="high" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>

  <!-- ========================================================================
       OPENING SCREEN: NỀN TRẮNG, NÚT PLAY, HOA XOAY & MÀN HÌNH SPLIT 2 BÊN
       ======================================================================== -->
  <div id="opening-screen" class="opening-overlay">
    <!-- Cánh cửa trái -->
    <div class="opening-shutter shutter-left"></div>
    <!-- Cánh cửa phải -->
    <div class="opening-shutter shutter-right"></div>

    <!-- Cụm trung tâm -->
    <div class="opening-center-stage">
      <!-- 1. Nút Play tối giản thuần tam giác -->
      <button class="opening-play-btn" id="opening-play-btn" aria-label="Bắt đầu">
        <svg class="play-triangle-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 7.5 4.5 L 19.5 12 L 7.5 19.5 Z" fill="var(--mirror-gold)" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- 2. Bông hoa xoay tròn ở giữa sau khi bấm Play -->
      <div class="opening-flower-box" id="opening-flower-box" aria-hidden="true">
        <svg class="opening-flower-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="54" stroke="var(--mirror-gold-light)" stroke-width="1" stroke-dasharray="3 4" />
          <circle cx="60" cy="60" r="48" stroke="var(--mirror-gold)" stroke-width="0.8" opacity="0.6" />
          <!-- 8 Cánh hoa đối xứng thanh tao -->
          <g class="flower-petals-group" stroke="var(--mirror-gold)" stroke-width="1.4" fill="rgba(197, 160, 89, 0.08)">
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(45 60 60)" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(90 60 60)" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(135 60 60)" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(180 60 60)" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(225 60 60)" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(270 60 60)" />
            <path d="M 60 60 C 50 42 50 20 60 14 C 70 20 70 42 60 60 Z" transform="rotate(315 60 60)" />
          </g>
          <!-- Nhụy hoa mạ vàng ở tâm -->
          <circle cx="60" cy="60" r="10" fill="var(--mirror-gold)" />
          <circle cx="60" cy="60" r="4.5" fill="#ffffff" />
          <circle cx="60" cy="46" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="70" cy="50" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="74" cy="60" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="70" cy="70" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="60" cy="74" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="50" cy="70" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="46" cy="60" r="1.5" fill="var(--mirror-gold)" />
          <circle cx="50" cy="50" r="1.5" fill="var(--mirror-gold)" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Bố cục song liên đối xứng (Diptych Layout) -->
  <main class="split-layout">
    
    <!-- CỘT BÊN TRÁI: KHUNG THƠ MỸ THUẬT ĐỐI XỨNG ĐỒNG ĐIỆU VỚI TRANH -->
    <section class="content-panel">
      <div class="poetry-card-frame">
        <!-- Viền gương kim loại kép đồng bộ với khung tranh bên phải -->
        <div class="mirror-beveled-rim"></div>

        <!-- 4 Góc hoa văn khung gương cổ điển -->
        <svg class="mirror-corner corner-tl" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
          <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
          <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
          <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
          <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
        </svg>

        <svg class="mirror-corner corner-tr" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
          <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
          <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
          <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
          <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
        </svg>

        <svg class="mirror-corner corner-bl" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
          <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
          <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
          <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
          <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
        </svg>

        <svg class="mirror-corner corner-br" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
          <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
          <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
          <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
          <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
        </svg>

        <!-- Điểm nhấn vòm gương nhẹ nhàng trên và dưới -->
        <svg class="mirror-crest crest-top" viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 5 10 Q 30 2 50 14 Q 70 2 95 10" stroke="var(--mirror-gold)" stroke-width="1.2" />
          <circle cx="50" cy="6" r="2.5" fill="var(--mirror-gold)" />
        </svg>
        <svg class="mirror-crest crest-bottom" viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 5 10 Q 30 2 50 14 Q 70 2 95 10" stroke="var(--mirror-gold)" stroke-width="1.2" />
          <circle cx="50" cy="6" r="2.5" fill="var(--mirror-gold)" />
        </svg>

        <!-- Nội dung đoạn thơ nằm chính giữa khung -->
        <div class="poetry-content">
          <div class="poem-ornament">✦ ✦ ✦</div>
          <div class="poem-wrapper">
            <p class="poem-line">“Ngày anh thấy được em, trời chao mình nắng đổ</p>
            <p class="poem-line">Em trác tuyệt như hoa, đẹp tựa sớm mai hồng”</p>
          </div>
          <div class="poem-ornament">✦ ✦ ✦</div>
        </div>
      </div>
    </section>

    <!-- CỘT BÊN PHẢI: KHUNG TRANH 2.5D VỚI KHUNG GƯƠNG HOA VĂN CHỮ NHẬT -->
    <section class="stage-panel">
      <div class="parallax-stage-wrapper" id="stage-wrapper">
        <!-- Spacer image keeping original 2983x2000 aspect ratio locked -->
        <img src="assets/b1.webp" alt="" class="art-spacer" aria-hidden="true" />

        <div class="parallax-stage">
          <!-- Cụm 1.1: Bầu trời viễn cảnh (Cluster B1) -->
          <div class="art-layer-cluster cluster-b1" id="cluster-b1">
            <img src="assets/b1.webp" alt="Nền trời viễn cảnh (B1)" class="art-layer layer-b1" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 1.2: Kiến trúc xa (Cluster B2: B2, B2_1) -->
          <div class="art-layer-cluster cluster-b2" id="cluster-b2">
            <img src="assets/b2.webp" alt="Kiến trúc / cảnh quan xa (B2)" class="art-layer layer-b2" draggable="false" decoding="async" />
            <img src="assets/b2_1.webp" alt="Kiến trúc / cảnh quan xa phụ (B2_1)" class="art-layer layer-b2_1" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 1.3: Cảnh quan trung hậu (Cluster B3) -->
          <div class="art-layer-cluster cluster-b3" id="cluster-b3">
            <img src="assets/b3.webp" alt="Cảnh quan trung hậu (B3)" class="art-layer layer-b3" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 1.4: Cảnh quan trung cảnh sau (Cluster B4 - tách khỏi B3) -->
          <div class="art-layer-cluster cluster-b4" id="cluster-b4">
            <img src="assets/b4.webp" alt="Cảnh quan trung cảnh sau (B4)" class="art-layer layer-b4" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 2: Trung cảnh & Thân nhân vật (Character Midground Cluster - C1) -->
          <div class="art-layer-cluster cluster-mid" id="cluster-mid">
            <img src="assets/c1.webp" alt="Nhân vật Mai Hương (C1)" class="art-layer layer-c1" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 2.1: Phụ kiện nhân vật tách độc lập (Cluster C1_1) -->
          <div class="art-layer-cluster cluster-c1_1" id="cluster-c1_1">
            <img src="assets/c1_1.webp" alt="Chi tiết phụ kiện nhân vật (C1_1)" class="art-layer layer-c1_1" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 3: Tiền cảnh - Bộ F (Foreground F-Cluster: F0, F1, F2, F3) -->
          <div class="art-layer-cluster cluster-fg" id="cluster-fg">
            <img src="assets/f0.webp" alt="Tiền cảnh nền (F0)" class="art-layer layer-f0" draggable="false" decoding="async" />
            <img src="assets/f1.webp" alt="Thạch đài tiền cảnh (F1)" class="art-layer layer-f1" draggable="false" decoding="async" />
            <img src="assets/f2.webp" alt="Cánh hoa / hạt sáng lơ lửng (F2)" class="art-layer layer-f2" draggable="false" decoding="async" />
            <img src="assets/f3.webp" alt="Khí quyển / bụi sáng (F3)" class="art-layer layer-f3" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 4: Cận cảnh riêng biệt - Lớp SF1 (Tách độc lập khỏi bộ F) -->
          <div class="art-layer-cluster cluster-sf" id="cluster-sf">
            <img src="assets/sf1.webp" alt="Khối đá / bệ tiền cảnh cận cảnh (SF1)" class="art-layer layer-sf1" draggable="false" decoding="async" />
          </div>

          <!-- Cụm 5: Lớp trên cùng - SSF1 -->
          <div class="art-layer-cluster cluster-top" id="cluster-top">
            <img src="assets/ssf1.webp" alt="Quang hoàn / ánh sáng viền ngoài cùng (SSF1)" class="art-layer layer-ssf1" draggable="false" decoding="async" />
          </div>
        </div>

        <!-- LỚP KHIÊN VÔ HÌNH CHỐNG TRỘM TÁCH LAYER -->
        <div class="art-shield-overlay" id="art-shield" aria-hidden="true"></div>

        <!-- MÀN HÌNH BẢO VỆ BẢN QUYỀN KHI BẬT DEVTOOLS -->
        <div class="security-warning-overlay" id="security-warning" aria-hidden="true">
          <div class="security-warning-box">
            <span class="security-icon">✦ 🛡️ ✦</span>
            <h2 class="security-title">CHẾ ĐỘ BẢO VỆ BẢN QUYỀN</h2>
            <p class="security-desc">Vui lòng đóng công cụ lập trình (DevTools / F12) để tiếp tục chiêm ngưỡng tác phẩm.</p>
            <span class="security-badge">Protected by thaoquang2452</span>
          </div>
        </div>

        <!-- KHUNG GƯƠNG HOA VĂN MỸ THUẬT CHỮ NHẬT VỪA KHỚP TRANH (MIRROR FRAME OVERLAY) -->
        <div class="mirror-frame-overlay" aria-hidden="true">
          <!-- Viền gờ kim loại mạ vàng cổ vát cạnh (Beveled Rim) -->
          <div class="mirror-beveled-rim"></div>

          <!-- 4 Góc hoa văn khung gương kiểu Rococo / Vintage Acanthus -->
          <svg class="mirror-corner corner-tl" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
            <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
            <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
            <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
            <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
          </svg>

          <svg class="mirror-corner corner-tr" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
            <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
            <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
            <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
            <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
          </svg>

          <svg class="mirror-corner corner-bl" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
            <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
            <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
            <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
            <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
          </svg>

          <svg class="mirror-corner corner-br" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 3 67 V 18 C 3 9.72 9.72 3 18 3 H 67" stroke="var(--mirror-gold)" stroke-width="1.8" />
            <path d="M 8 67 V 22 C 8 14.27 14.27 8 22 8 H 67" stroke="var(--mirror-gold-light)" stroke-width="0.9" stroke-dasharray="2 3" />
            <path d="M 5 32 C 12 32 24 25 28 14 C 30 8 23 5 19 8 C 15 11 17 16 21 15" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <path d="M 32 5 C 32 12 25 24 14 28 C 8 30 5 23 8 19 C 11 15 16 17 15 21" stroke="var(--mirror-gold)" stroke-width="1.2" stroke-linecap="round" />
            <circle cx="18" cy="18" r="3.2" fill="var(--mirror-gold)" />
            <circle cx="18" cy="18" r="1.2" fill="#ffffff" />
            <circle cx="5" cy="5" r="1.8" fill="var(--mirror-gold)" />
          </svg>

          <!-- Điểm nhấn vòm gương nhẹ nhàng giữa cạnh trên & cạnh dưới -->
          <svg class="mirror-crest crest-top" viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 5 10 Q 30 2 50 14 Q 70 2 95 10" stroke="var(--mirror-gold)" stroke-width="1.2" />
            <circle cx="50" cy="6" r="2.5" fill="var(--mirror-gold)" />
          </svg>
          <svg class="mirror-crest crest-bottom" viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 5 10 Q 30 2 50 14 Q 70 2 95 10" stroke="var(--mirror-gold)" stroke-width="1.2" />
            <circle cx="50" cy="6" r="2.5" fill="var(--mirror-gold)" />
          </svg>
        </div>

      </div>
    </section>

  </main>

  <!-- Script Controller -->
  <script src="scripts/main.js"></script>
</body>
</html>
